vocabularies:
  # The words this record's documents may use, and what each means.
  #
  # A DEFAULT, not a law: rename these, drop the ones you do not want,
  # add your own. Every check reads this. The one rule is that a
  # scheme's `active` word has to appear here — it is how everything
  # decides what is in force, so a vocabulary without it means no
  # document ever is.
  #
  # Named once and referenced by every scheme that uses it, so two
  # schemes sharing a vocabulary cannot drift apart (ADR-tmp8hp25).
  statuses:
    Active:
      blurb: in force — the current answer, and what a citation should normally point at
    Proposed:
      blurb: not in force yet — an open question, so citing it as settled is the thing the report catches
    Deferred:
      blurb: not in force and not being worked on; the question is real and the answer is waiting on something
    Superseded:
      blurb: no longer in force because something replaced it; the successor is named in the field, not the prose
    Rejected:
      blurb: no longer in force and nothing replaced it — kept because a rejection is worth being able to point at
  adr-tags:
    record:
      label: The record
      blurb: what the four layers hold, and the rules between them
    mechanism:
      label: Mechanism
      blurb: collectors, generators, the lint, the directive vocabulary
    process:
      label: Process
      blurb: how the machinery is adopted, run, and reported on
    architecture:
      label: Architecture
      blurb: how mantle is built — the shell, the manifest, the data it reads
    product:
      label: Product
      blurb: what a visitor and a publishing project get, and what they are spared
  review-statuses:
    label: Retrospective and postmortem statuses
    blurb: Where a RETRO or a POSTMORTEM stands. Neither is ever deleted; each is accepted, or replaced
      by a fuller review of the same change or period (the decision adopting nucleation's retrospective
      process).
    terms:
      Draft:
        label: Draft
        blurb: written and not yet accepted by the owner
      Accepted:
        label: Accepted
        blurb: the owner accepts its account of what happened and what it recommends
      Superseded:
        label: Superseded
        blurb: replaced by a later review of the same change, named in `superseded_by`
issue_url: 'https://github.com/dmarx/mantle/issues/{n}'
paths:
  docs: docs
  decisions: record/decisions.d
  design_principles: docs/design-principles.md
  reports: docs/reports
fragments:
  record/changelog.d: CHANGELOG.md
journals:
  devlog:
    dir: record/devlog.d
    output: docs/devlog
    granularity: month
    title: Development log
    blurb: Notes taken during the work, including the ones for the next retrospective (RETRO), tagged
      `retro` - what seems to be going right and why, what is going wrong, the wrong theories and how
      they were found out. Each retrospective reads the `retro` entries filed since the last.
code:
  globs: []
  historical:
  - CHANGELOG.md
schemes:
  ADR:
    title: Decisions
    blurb: >-
      A decision about how the project works, with the alternatives it
      rejected. It is superseded when the choice changes, and corrected in
      place, with its version bumped, when only a reason was wrong.
    dir: record/decisions.d
    output: docs/decisions
    active: Active
    render: index
    successor: superseded_by
    retires_on: Superseded
    fields:
      status:
        vocabulary: statuses
      tags:
        vocabulary: adr-tags
        many: true
        required: true
        closed: false
    axis: tags
    references:
      superseded_by:
        scheme: ADR
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Active
      reviewed_by:
        label: Reviewed by
        blurb: the retrospectives and postmortems that review how this decision has worked, derived
          from their `reviews`, computed for every reader and never stored
        scheme: [RETRO, POSTMORTEM]
        required: false
        many: true
        converse: reviews
        derived: true
      prompted_by:
        label: Prompted by
        blurb: the retrospectives and postmortems whose recommendations this decision carries out,
          derived from their `prompted`, computed for every reader and never stored
        scheme: [RETRO, POSTMORTEM]
        required: false
        many: true
        converse: prompted
        derived: true
      procedures:
        label: Procedures
        blurb: the standard operating procedures that carry out this decision's rules step by step,
          derived from their `implements`, computed for every reader and never stored
        scheme: SOP
        required: false
        many: true
        converse: implements
        derived: true
  DP:
    title: Design principles
    blurb: >-
      A standing value that decisions cite by number, stated as a claim
      someone could disagree with. Read as one page.
    dir: record/principles.d
    active: Active
    render: document
    output: docs/design-principles.md
    successor: superseded_by
    retires_on: Superseded
    fields:
      status:
        vocabulary: statuses
      tags:
        many: true
        required: true
        closed: false
    axis: tags
    references:
      superseded_by:
        scheme: DP
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Active
  SOP:
    title: Standard operating procedures
    blurb: >-
      Step-by-step instructions for a process that is run more than once: when to run it, what
      must be true before starting, the numbered steps each with how to tell it worked, when it is
      done, and the traps. A decision (ADR) holds why and the invariants; an SOP holds how, and
      names the decisions it carries out in `implements`. It is revised in place, with its version
      bumped and a history entry, whenever a run shows a step is wrong or missing; it is superseded
      only when the process itself is replaced.
    dir: record/procedures.d
    output: docs/procedures
    active: Active
    render: index
    successor: superseded_by
    retires_on: Superseded
    fields:
      status:
        vocabulary: statuses
      tags:
        vocabulary: adr-tags
        many: true
        required: true
        closed: false
      when:
        label: When to run
        blurb: the occasion that calls for this procedure, in one sentence
        required: true
    axis: tags
    references:
      implements:
        label: Implements
        blurb: the decisions whose rules this procedure carries out step by step
        scheme: ADR
        required: false
        many: true
        converse: procedures
      superseded_by:
        scheme: SOP
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Active
  RETRO:
    title: Retrospectives
    blurb: >-
      A review of how a change, or a stretch of work, has gone: what it covered, what went well
      and why, so that it can be kept on purpose, what did not, and what to change. It reads the
      devlog entries tagged `retro` filed since the last retrospective and cites them by date,
      and answers by name every one tagged `earmarked`. It may review the decisions whose changes
      or procedures it assesses, link the pull requests and discussions, and name in `prompted`
      the decisions its recommendations become. Something that went wrong and needs its own
      account is a POSTMORTEM.
    dir: record/retrospectives.d
    output: docs/retrospectives
    active: Accepted
    render: index
    references:
      reviews:
        label: Reviews
        blurb: the decisions whose changes or procedures this retrospective assesses
        scheme: ADR
        required: false
        many: true
        converse: reviewed_by
      prompted:
        label: Prompted
        blurb: the decisions that carry out this retrospective's recommendations, added once they are filed
        scheme: ADR
        required: false
        many: true
        converse: prompted_by
      superseded_by:
        scheme: RETRO
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Accepted
    fields:
      status:
        vocabulary: review-statuses
      tags:
        vocabulary: adr-tags
        many: true
        required: true
        closed: false
      pull_requests:
        label: Pull requests
        blurb: the pull requests of the change or stretch of work reviewed, as URLs
        many: true
        required: false
      discussions:
        label: Discussions
        blurb: where the retrospective was asked for or held, as URLs (a session, an issue, a pull
          request thread)
        many: true
        required: false
    axis: tags
    retires_on: Superseded
    successor: superseded_by
  POSTMORTEM:
    title: Postmortems
    blurb: >-
      A review in response to something that went wrong: a check that went red and stayed red, a
      revert, a broken release or published site, a standing rule broken or nearly broken, a
      decision revised soon after landing. What happened, why, what it cost, and what changes. It
      reviews the decisions whose procedure was in play and links the pull requests involved; its
      recommendations become decisions of their own, which it names in `prompted`. Rarer than a
      RETRO.
    dir: record/postmortems.d
    output: docs/postmortems
    active: Accepted
    render: index
    references:
      reviews:
        label: Reviews
        blurb: the decisions whose changes this postmortem reviews
        scheme: ADR
        required: true
        many: true
        converse: reviewed_by
      prompted:
        label: Prompted
        blurb: the decisions that carry out this postmortem's recommendations, added once they are filed
        scheme: ADR
        required: false
        many: true
        converse: prompted_by
      superseded_by:
        scheme: [POSTMORTEM, RETRO]
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Accepted
    fields:
      status:
        vocabulary: review-statuses
      tags:
        vocabulary: adr-tags
        many: true
        required: true
        closed: false
      pull_requests:
        label: Pull requests
        blurb: the pull requests that carried the reviewed change, as URLs
        many: true
        required: true
      discussions:
        label: Discussions
        blurb: where the review was asked for or held, as URLs (a session, an issue, a pull request
          thread)
        many: true
        required: false
    axis: tags
    retires_on: Superseded
    successor: superseded_by
remotes:
  LU:
    name: luria
    repo: dmarx/luria
    ref: main
    dir: record/decisions.d
    schemes:
      DP:
        document: docs/design-principles.md
  NU:
    name: nucleation
    repo: dmarx/nucleation
    ref: main
    dir: record/decisions.d
  FX:
    name: fixtures
    url: https://github.com/dmarx/luria/blob/main/docs/directives.md#fixture-codes
lint:
  fail_on:
  - workflow-temp-codes
